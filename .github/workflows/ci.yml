name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:              # least privilege for the built-in GITHUB_TOKEN
  contents: read
  packages: write         # push images to GHCR
  id-token: write         # keyless Cosign signing via OIDC

concurrency:              # a newer push cancels the older run on the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/myapp
  CONFIG_REPO: ${{ github.repository_owner }}/platform-config

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest --cov=src --cov-fail-under=80 --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.xml

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error

  deps-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint chart/ --set image.tag=ci
      - run: helm template myapp chart/ --set image.tag=ci > /dev/null

  build:
    needs: [test, sast, deps-scan, chart-lint]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---- everything below runs only after a merge to main ----
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image with SBOM and provenance
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - name: Sign the image
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  update-config:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the config repo token
        id: token
        env:
          TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CONFIG_REPO_TOKEN is not set; skipping the dev tag bump. See README."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump the dev image tag
        if: steps.token.outputs.present == 'true'
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' envs/dev/myapp/values.yaml
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "deploy(dev): myapp ${{ github.sha }}"
          git push
